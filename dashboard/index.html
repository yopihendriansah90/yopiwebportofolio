<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Dashboard Lokal</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202124; }
    body { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; background: #f5f6f8; }
    main { padding: 24px; border-radius: 14px; background: white; box-shadow: 0 8px 30px #0000000d; }
    h1 { margin-top: 0; } p { color: #5f6368; }
    textarea { width: 100%; min-height: 440px; box-sizing: border-box; padding: 14px; border: 1px solid #ccd0d5; border-radius: 8px; font: 14px/1.5 ui-monospace, monospace; }
    section { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e5e7eb; }
    button { border: 0; border-radius: 7px; padding: 10px 16px; cursor: pointer; background: #1a73e8; color: white; font-weight: 600; }
    button.secondary { background: #5f6368; } input { margin: 12px 0; }
    #status { min-height: 24px; margin-top: 12px; font-weight: 600; }
    code { background: #f0f1f3; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio Dashboard Lokal</h1>
    <p>Edit data portfolio dan unggah gambar. Setelah selesai, jalankan proses build lalu <code>git commit</code> dan <code>git push</code>.</p>
    <section>
      <h2>Data portfolio</h2>
      <textarea id="json" spellcheck="false" aria-label="Data portfolio JSON"></textarea>
      <br><br>
      <button id="load">Muat ulang</button>
      <button id="save">Simpan data.json</button>
    </section>
    <section>
      <h2>Upload gambar</h2>
      <p>Gambar akan disimpan ke <code>dist/wp-content/uploads/portfolio/</code>.</p>
      <input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
      <br>
      <button id="upload" class="secondary">Upload gambar</button>
    </section>
    <div id="status" role="status"></div>
  </main>
  <script>
    const editor = document.querySelector('#json');
    const status = document.querySelector('#status');
    const setStatus = (message, error = false) => { status.textContent = message; status.style.color = error ? '#b3261e' : '#137333'; };
    async function loadData() {
      const response = await fetch('/api/data', { cache: 'no-store' });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Gagal memuat data.');
      editor.value = JSON.stringify(data, null, 2);
      setStatus('Data berhasil dimuat.');
    }
    document.querySelector('#load').addEventListener('click', () => loadData().catch(error => setStatus(error.message, true)));
    document.querySelector('#save').addEventListener('click', async () => {
      try {
        const response = await fetch('/api/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: editor.value });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Gagal menyimpan data.');
        setStatus(result.message);
      } catch (error) { setStatus(error.message, true); }
    });
    document.querySelector('#upload').addEventListener('click', async () => {
      const file = document.querySelector('#image').files[0];
      if (!file) return setStatus('Pilih gambar terlebih dahulu.', true);
      try {
        const form = new FormData(); form.append('image', file);
        const response = await fetch('/api/upload-image', { method: 'POST', body: form });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Gagal mengunggah gambar.');
        setStatus(`Berhasil: ${result.url}`);
      } catch (error) { setStatus(error.message, true); }
    });
    loadData().catch(error => setStatus(error.message, true));
  </script>
</body>
</html>
